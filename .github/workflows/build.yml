name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER" 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |error:|What went wrong|Execution failed|> ' build.log | head -60 | cut -c1-400 | sed 's/$/%0A/' | tr -d '\n')
          echo "::error title=build-errors::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "luna-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: luna-apk
          path: luna-*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: luna-*.apk
          generate_release_notes: true
