name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      # The signing key lives only in GitHub Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # optionally KEY_ALIAS / KEY_PASSWORD). Tagged releases refuse to build without it.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/luna.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release builds need the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets"
            exit 1
          else
            echo "::warning::No signing secrets set; building with the debug key"
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER" 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |error:|What went wrong|Execution failed|> ' build.log | head -60 | cut -c1-400 | sed 's/$/%0A/' | tr -d '\n')
          echo "::error title=build-errors::$msg"

      - name: Rename APK and write checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "luna-${VERSION_NAME}.apk"
          sha256sum "luna-${VERSION_NAME}.apk" > "luna-${VERSION_NAME}.apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: luna-apk
          path: luna-*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            luna-*.apk
            luna-*.apk.sha256
          generate_release_notes: true
